<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>homescreen · dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f1f5f9;
    background: #0b1220;
  }

  /* === Background: two stacked animated GIFs for crossfade === */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: #0b1220;
  }
  .bg img {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100vw;
    min-height: 100vh;
    width: auto;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    filter: brightness(0.95) contrast(1.05) saturate(1.25);
    transition: opacity 1.2s ease-in-out;
  }
  #bg-fade { opacity: 0; }

  /* === ONE consolidated tile, top-left, compact === */
  .tile {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 1;
    width: 340px;
    background: rgba(11, 18, 32, 0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(99, 102, 241, 0.35);
    border-radius: 14px;
    padding: 12px 14px;
    color: #f1f5f9;
    font-size: 11px;
    line-height: 1.45;
  }
  .tile .hdr {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(99, 102, 241, 0.2);
  }
  .tile .hdr .title {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #94a3b8;
    text-transform: uppercase;
    font-weight: 700;
  }
  .tile .hdr .live {
    font-size: 9px;
    color: #22c55e;
    font-weight: 700;
    letter-spacing: 0.1em;
  }
  .tile .hdr .live.warn { color: #f59e0b; }
  .tile .hdr .live.crit { color: #ef4444; }

  /* === Time block: biggest element === */
  .time-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .clock {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .date {
    font-size: 11px;
    color: #cbd5e1;
  }

  /* === Compact status rows === */
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
    gap: 8px;
  }
  .row .lbl { color: #94a3b8; font-size: 10px; }
  .row .val { font-size: 11px; font-weight: 600; text-align: right; }
  .row .val.green { color: #22c55e; }
  .row .val.red { color: #ef4444; }
  .row .val.amber { color: #f59e0b; }
  .row .val.cyan { color: #67e8f9; }

  /* === Calendar: next event rows === */
  .cal-section {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(99, 102, 241, 0.18);
  }
  .cal-section .cal-lbl {
    color: #94a3b8;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .cal-event {
    display: flex;
    gap: 6px;
    padding: 2px 0;
    align-items: flex-start;
  }
  .cal-event + .cal-event {
    border-top: 1px solid rgba(99, 102, 241, 0.1);
    margin-top: 2px;
    padding-top: 4px;
  }
  .cal-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #818cf8;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .cal-dot.now { background: #22c55e; }   /* happening now — green */
  .cal-dot.upcoming { background: #f59e0b; }  /* today — amber */
  .cal-event-text { flex: 1; }
  .cal-event-title {
    font-size: 10px;
    font-weight: 600;
    color: #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-event-time {
    font-size: 9px;
    color: #94a3b8;
    margin-top: 1px;
  }
  .cal-empty {
    font-size: 10px;
    color: #64748b;
    font-style: italic;
  }

  /* === Monitors list: compact === */
  .mons {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(99, 102, 241, 0.18);
  }
  .mons .lbl {
    color: #94a3b8;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  .mons .lbl .count { color: #22c55e; }
  .mons .lbl .count.warn { color: #f59e0b; }
  .mons .lbl .count.crit { color: #ef4444; }
  .mons .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 6px;
  }
  .mon {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    padding: 2px 4px;
    border-radius: 3px;
    background: rgba(30, 41, 59, 0.5);
  }
  .mon.down { opacity: 0.65; }
  .mon .name { color: #e2e8f0; font-weight: 600; }
  .mon .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    flex-shrink: 0;
    margin-left: 4px;
  }
  .mon.down .dot { background: #ef4444; }

  /* === Footer pill (bottom-right corner, compact) === */
  .footer {
    position: fixed;
    bottom: 14px;
    right: 14px;
    z-index: 1;
    background: rgba(11, 18, 32, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(99, 102, 241, 0.25);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 9px;
    color: #94a3b8;
    letter-spacing: 0.05em;
  }
  .footer .v { color: #cbd5e1; font-weight: 600; }
</style>
</head>
<body>

<div class="bg">
  <img id="bg-main" src="/backgrounds/alone.gif" alt="">
  <img id="bg-fade" src="" alt="">
</div>

<div class="tile">
  <div class="hdr">
    <span class="title">homescreen</span>
    <span class="live" id="live-tag">● LIVE</span>
  </div>

  <!-- Time -->
  <div class="time-row">
    <div class="clock" id="clock">--:-- --</div>
  </div>
  <div class="date" id="date">--</div>

  <!-- Identity + Status rows -->
  <div class="row" style="margin-top:8px">
    <span class="lbl">weather</span>
    <span class="val cyan" id="wx-now">—</span>
  </div>
  <div class="row">
    <span class="lbl">tailscale</span>
    <span class="val green" id="ts-count">—</span>
  </div>
  <div class="row">
    <span class="lbl">r-server</span>
    <span class="val" id="rs-status">—</span>
  </div>
  <div class="row">
    <span class="lbl">cpu · mem · disk</span>
    <span class="val cyan" id="rs-stats">— · — · —</span>
  </div>
  <div class="row">
    <span class="lbl">uptime</span>
    <span class="val" id="rs-up">—</span>
  </div>
  <div class="row">
    <span class="lbl">audio</span>
    <span class="val" id="audio-status">—</span>
  </div>

  <!-- Calendar: HAPPENING NOW + UP NEXT -->
  <div class="cal-section">
    <div class="cal-lbl">happening now</div>
    <div id="cal-now">
      <div class="cal-empty">—</div>
    </div>
  </div>
  <div class="cal-section">
    <div class="cal-lbl">up next</div>
    <div id="cal-next">
      <div class="cal-empty">loading…</div>
    </div>
  </div>

  <!-- Monitors -->
  <div class="mons">
    <div class="lbl">
      <span>monitors</span>
      <span class="count" id="mon-count">— UP · — DOWN</span>
    </div>
    <div class="grid" id="mons-grid">
      <div class="mon"><span class="name">loading…</span><span class="dot"></span></div>
    </div>
  </div>
</div>

<!-- Footer: bg name + somafm + version -->
<div class="footer">
  bg: <span class="v" id="f-bg">—</span> · ♫ somafm · 100.110.212.126 · v2.3
</div>

<script>
const REFRESH_MS  = 10000;
const BG_MS        = 5 * 60 * 1000;   // rotate background every 5 min
const PRELOAD_AHEAD = 30 * 1000;       // preload 30s before rotate

// ── Clock ────────────────────────────────────────────────────────────────────
function pad(n) { return n < 10 ? "0" + n : "" + n; }

function updateClock() {
  const d = new Date();
  let h = d.getHours();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12; if (h === 0) h = 12;
  document.getElementById("clock").textContent = h + ":" + pad(d.getMinutes()) + " " + ampm;
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  document.getElementById("date").textContent =
    days[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate();
}

// ── API helpers ──────────────────────────────────────────────────────────────
async function fetchJSON(url) {
  try { const r = await fetch(url, { cache: "no-store" }); return await r.json(); }
  catch (e) { return null; }
}

function escapeHTML(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ── Status refreshers ─────────────────────────────────────────────────────────
async function refreshIdentity() {
  const d = await fetchJSON("/identity.json"); if (!d) return;
  const tsState = (d.tailscale || "—").toLowerCase();
  const live = document.getElementById("live-tag");
  if (tsState === "online") {
    live.textContent = "● ONLINE"; live.className = "live";
  } else if (tsState === "offline") {
    live.textContent = "○ OFFLINE"; live.className = "live crit";
  } else {
    live.textContent = "— " + (d.tailscale || "unknown").toUpperCase();
    live.className = "live warn";
  }
}

async function refreshMonitors() {
  const d = await fetchJSON("/monitors.json"); if (!d) return;
  const monitors = d.monitors || [];
  const up = monitors.filter(m => m.active).length;
  const down = monitors.length - up;
  const cnt = document.getElementById("mon-count");
  cnt.textContent = up + " UP · " + down + " DOWN";
  cnt.className = "count" + (down > 0 ? " crit" : "");
  const grid = document.getElementById("mons-grid");
  grid.innerHTML = "";
  for (const m of monitors.slice(0, 10)) {
    const div = document.createElement("div");
    div.className = "mon" + (m.active ? "" : " down");
    div.innerHTML = '<span class="name">' + escapeHTML(m.name) + '</span><span class="dot"></span>';
    grid.appendChild(div);
  }
}

async function refreshRSStats() {
  const d = await fetchJSON("/rserver-stats.json"); if (!d) return;
  document.getElementById("rs-stats").textContent =
    (d.cpu || "—") + "% · " + (d.mem || "—") + "% · " + (d.disk || "—") + " GB";
  document.getElementById("rs-up").textContent = d.uptime || "—";
  const status = document.getElementById("rs-status");
  if (d.cpu && d.cpu !== "—") {
    status.textContent = "● online";
    status.className = "val green";
  } else {
    status.textContent = "○ " + (d.error || "unknown");
    status.className = "val amber";
  }
}

async function refreshHermes() {
  const d = await fetchJSON("/hermes-health.json"); if (!d) return;
  document.getElementById("ts-count").textContent = d.tailscale_online || "—";
}

async function refreshWeather() {
  const w = await fetchJSON("/weather.json"); if (!w) return;
  const cond = (w.cond || "—");
  document.getElementById("wx-now").textContent =
    (w.temp || "—") + "°" + (cond !== "—" ? " " + cond : "");
}

async function refreshAudio() {
  const a = await fetchJSON("/audio.json"); if (!a) return;
  const el = document.getElementById("audio-status");
  if (a.playing) {
    const track = (a.track || a.station || "").replace(/^.*? - /, "").slice(0, 32);
    el.textContent = "♫ " + (track || "playing");
    el.className = "val cyan";
  } else {
    el.textContent = "○ off";
    el.className = "val amber";
  }
}

// ── Calendar ──────────────────────────────────────────────────────────────────
async function refreshCalendar() {
  const d = await fetchJSON("/calendar.json"); if (!d) return;

  // HAPPENING NOW
  const nowContainer = document.getElementById("cal-now");
  const nowEvents = d.now || [];
  if (d.error) {
    nowContainer.innerHTML = '<div class="cal-empty">unavailable</div>';
  } else if (nowEvents.length === 0) {
    nowContainer.innerHTML = '<div class="cal-empty">—</div>';
  } else {
    nowContainer.innerHTML = "";
    for (const ev of nowEvents) {
      const div = document.createElement("div");
      div.className = "cal-event";
      div.innerHTML =
        '<span class="cal-dot now"></span>' +
        '<div class="cal-event-text">' +
          '<div class="cal-event-title" title="' + escapeHTML(ev.summary) + '">' +
            escapeHTML(ev.summary) + '</div>' +
          '<div class="cal-event-time">' + escapeHTML(ev.start) + '</div>' +
        '</div>';
      nowContainer.appendChild(div);
    }
  }

  // UP NEXT
  const nextContainer = document.getElementById("cal-next");
  const nextEvents = d.next || [];
  if (d.error) {
    nextContainer.innerHTML = '<div class="cal-empty">unavailable</div>';
  } else if (nextEvents.length === 0) {
    nextContainer.innerHTML = '<div class="cal-empty">no upcoming events</div>';
  } else {
    nextContainer.innerHTML = "";
    for (const ev of nextEvents) {
      const div = document.createElement("div");
      div.className = "cal-event";
      const dotClass = ev.start.toLowerCase().includes("today") ? "upcoming" : "";
      div.innerHTML =
        '<span class="cal-dot ' + dotClass + '"></span>' +
        '<div class="cal-event-text">' +
          '<div class="cal-event-title" title="' + escapeHTML(ev.summary) + '">' +
            escapeHTML(ev.summary) + '</div>' +
          '<div class="cal-event-time">' + escapeHTML(ev.start) + '</div>' +
        '</div>';
      nextContainer.appendChild(div);
    }
  }
}

// ── Flash-free background rotation ────────────────────────────────────────────
let _currentBg = "alone.gif";
let _nextBg    = null;
let _preloadTimer = null;

async function _pickBg(exclude) {
  const list = await fetchJSON("/backgrounds/list.json");
  if (!list || !list.backgrounds || list.backgrounds.length === 0) return null;
  const opts = list.backgrounds.filter(b => b !== exclude);
  return opts.length > 0 ? opts[Math.floor(Math.random() * opts.length)] : null;
}

function _doRotate(newBg) {
  if (!newBg) return;
  const main = document.getElementById("bg-main");
  const fade = document.getElementById("bg-fade");

  // Start fade-in of the new image via the fade layer
  fade.src = "/backgrounds/" + encodeURIComponent(newBg) + "?t=" + Date.now();
  fade.onload = () => {
    // Once loaded, crossfade: fade layer goes 1 → main goes 0
    main.style.opacity = "0";
    fade.style.opacity = "1";
    // After transition, make main point to new image, reset both
    setTimeout(() => {
      main.src = fade.src;
      main.style.opacity = "1";
      fade.style.opacity = "0";
      fade.src = "";
    }, 1300);
  };

  _currentBg = newBg;
  document.getElementById("f-bg").textContent = newBg.replace(/\.gif$/i, "");
}

async function rotateBackground() {
  const newBg = await _pickBg(_currentBg);
  if (newBg && newBg !== _currentBg) {
    _doRotate(newBg);
  }
}

function schedulePreload() {
  if (_preloadTimer) clearTimeout(_preloadTimer);
  _preloadTimer = setTimeout(async () => {
    const next = await _pickBg(_currentBg);
    if (next && next !== _currentBg) {
      _nextBg = next;
      // Eagerly load into a hidden img so browser caches it
      const img = new Image();
      img.src = "/backgrounds/" + encodeURIComponent(next) + "?t=" + Date.now();
    }
    // Schedule the actual rotate
    _preloadTimer = setTimeout(() => rotateBackground(), BG_MS - PRELOAD_AHEAD);
  }, PRELOAD_AHEAD);
}

// ── Init ──────────────────────────────────────────────────────────────────────
updateClock();
setInterval(updateClock, 1000);

refreshIdentity(); refreshMonitors(); refreshRSStats();
refreshHermes(); refreshWeather(); refreshAudio(); refreshCalendar();
setInterval(() => {
  refreshIdentity(); refreshMonitors(); refreshRSStats();
  refreshHermes(); refreshWeather(); refreshAudio(); refreshCalendar();
}, REFRESH_MS);

// Start background rotation loop
schedulePreload();
</script>
</body>
</html>
